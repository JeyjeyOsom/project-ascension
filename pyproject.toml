[project]
name = "project-ascension"
version = "0.1.0"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
files = ["apps/api"]
[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true
